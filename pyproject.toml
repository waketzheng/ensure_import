[project]
name = "ensure-import"
dynamic = ["version"]
description = "Auto install third part packages into virtual environment when import error."
authors = [{name="Waket Zheng", email="waketzheng@gmail.com"}]
readme = "README.md"
license = {text="MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
homepage = "https://github.com/waketzheng/ensure_import"

[tool.pdm.version]
path = "ensure_import/__init__.py"

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "mypy>=1.19.0",
    "types-pytz>=2025.2.0.20251108",
    "types-six>=1.17.0.20251009",
    "types-ujson>=5.10.0.20250822",
    "contextlib-chdir; python_version<'3.11'",
    "typing-extensions; python_version<'3.11'",
    "more-itertools>=11.1.0",
]
test = [
    "coverage>=7.10.7",
    "pytest-mock>=3.15.1",
]

[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.ty.rules]
unresolved-import = 'ignore'

[tool.ruff.lint]
ignore = ["E501"]
extend-select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "ANN",# https://docs.astral.sh/ruff/rules/#flake8-annotations-ann
]

[tool.ruff.lint.per-file-ignores]
"_test_*.py" = ["E401", "E402"]
"tests/**.py" = ["BLE001", "ANN"]
"scripts/*.py" = ["UP009", "ANN"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
